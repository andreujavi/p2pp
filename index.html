<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConectaMadera P2P - Videollamada</title>
    <!-- Socket.io CDN -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            background-color: #3b2211;
            background-image: linear-gradient(135deg, #5c3a21 0%, #3b2211 100%);
            color: #f4e3c1;
            font-family: sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #d4a373;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            font-size: 1.5rem;
        }
        /* LOBBY DE CONTACTOS */
        .lobby {
            width: 100%;
            max-width: 500px;
            background: #4a2e18;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #8b5a2b;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }
        .lobby h2 {
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: #dda15e;
        }
        .contact-list {
            list-style: none;
        }
        .contact-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #5c3a21;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #a67c52;
        }
        .call-button {
            background: #bc6c25;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .call-button:hover {
            background: #dda15e;
            color: #2c1810;
        }

        /* CONTENEDOR DE LLAMADA (VÍDEO Y CHAT) */
        .room-container {
            display: none;
            width: 100%;
            max-width: 700px;
            flex-direction: column;
            gap: 15px;
        }

        /* ZONA DE VÍDEOS EN DOS ZONAS (Principal y Flotante) */
        .video-container {
            position: relative;
            width: 100%;
            height: 450px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #8b5a2b;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }

        /* Pantalla de vídeo remoto (Zona Principal - Ocupa todo el fondo) */
        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Pantalla de vídeo usuario (Zona Secundaria - Esquina inferior derecha) */
        .local-video-box {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 120px;
            height: 160px;
            background: #222;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #dda15e;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6);
            z-index: 10;
        }

        #localVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Efecto espejo para la cámara propia */
        }

        .video-label {
            position: absolute;
            bottom: 5px;
            left: 5px;
            background: rgba(0,0,0,0.6);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            color: #fff;
            z-index: 11;
        }

        /* ZONA DE CHAT */
        .chat-box {
            background: #4a2e18;
            border-radius: 12px;
            border: 2px solid #8b5a2b;
            display: flex;
            flex-direction: column;
            height: 180px;
            padding: 10px;
        }
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 5px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .msg {
            background: #5c3a21;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            border-left: 4px solid #dda15e;
        }
        .chat-form {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .chat-input {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #8b5a2b;
            background: #2c1810;
            color: #fff;
            outline: none;
            font-size: 14px;
        }
        .send-button {
            background: #dda15e;
            color: #2c1810;
            border: none;
            padding: 8px 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>ConectaMadera P2P</h1>

    <!-- LOBBY DE CONTACTOS -->
    <div id="lobby" class="lobby">
        <h2>Selecciona un contacto para llamar</h2>
        <ul class="contact-list">
            <li class="contact-item">
                <span>Amigo 1 (Juan)</span>
                <button class="call-button" onclick="startCall('sala_juan')">Llamar</button>
            </li>
            <li class="contact-item">
                <span>Amigo 2 (María)</span>
                <button class="call-button" onclick="startCall('sala_maria')">Llamar</button>
            </li>
        </ul>
    </div>

    <!-- ZONA DE VÍDEO (DOS ZONAS) Y CHAT -->
    <div id="roomContainer" class="room-container">
        <!-- Contenedor de vídeo: pantalla grande remota + pantalla pequeña local -->
        <div class="video-container">
            <video id="remoteVideo" autoplay playsinline></video>
            <span class="video-label" style="bottom: auto; top: 10px; left: 10px;">Remoto</span>

            <div class="local-video-box">
                <video id="localVideo" autoplay playsinline muted></video>
                <span class="video-label">Tú</span>
            </div>
        </div>

        <!-- Caja de Chat -->
        <div class="chat-box">
            <div id="messagesContainer" class="messages-container"></div>
            <form id="chatForm" class="chat-form" onsubmit="sendMessage(event)">
                <input type="text" id="messageInput" class="chat-input" placeholder="Escribe un mensaje..." autocomplete="off">
                <button type="submit" class="send-button">Enviar</button>
            </form>
        </div>
    </div>

    <script>
        const socket = io('http://192.168.1.150:3000');

        let currentRoom = '';
        let localStream;
        let peerConnection;

       const servers = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        { urls: 'stun:stun3.l.google.com:19302' },
        { urls: 'stun:stun4.l.google.com:19302' }
    ]
};

        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const lobby = document.getElementById('lobby');
        const roomContainer = document.getElementById('roomContainer');
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');

        async function startCall(roomName) {
            currentRoom = roomName;
            lobby.style.display = 'none';
            roomContainer.style.display = 'flex';

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;

                socket.emit('join-room', roomName);
                createPeerConnection();

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('offer', { offer, room: currentRoom });
            } catch (error) {
                alert('Error al acceder a la cámara o micrófono: ' + error.message);
            }
        }

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(servers);

            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.ontrack = event => {
                remoteVideo.srcObject = event.streams[0];
            };

            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { candidate: event.candidate, room: currentRoom });
                }
            };
        }

        socket.on('offer', async (offer) => {
            if (!localStream) {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
            }
            createPeerConnection();
            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer', { answer, room: currentRoom });
        });

        socket.on('answer', async (answer) => {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
        });

        socket.on('ice-candidate', async (candidate) => {
            if (peerConnection) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
            }
        });

        function sendMessage(e) {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (text) {
                socket.emit('chat-message', { room: currentRoom, message: text, sender: 'Tú' });
                appendMessage('Tú', text);
                messageInput.value = '';
            }
        }

        socket.on('message', (data) => {
            appendMessage(data.sender, data.message);
        });

        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg';
            msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        async function startCall(roomName) {
    currentRoom = roomName;
    lobby.style.display = 'none';
    roomContainer.style.display = 'flex';

    // Comprobación de seguridad para evitar el error exacto que te sale
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert('Error: Tu navegador no permite el acceso a la cámara o estás entrado por HTTP inseguro. Usa HTTPS o localhost.');
        return;
    }

    try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        localVideo.srcObject = localStream;
        
        socket.emit('join-room', roomName);
        createPeerConnection();
        
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        socket.emit('offer', { offer, room: currentRoom });
    } catch (error) {
        alert('No se pudo acceder a la cámara o micrófono: ' + error.message);
    }
}
    </script>
</body>
</html>
