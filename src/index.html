<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P Dual-Zone Universal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 style="font-size: 12px; font-weight: bold;">P2P Dual-Zone (Cámaras + Chat)</h1>
        <button id="switchCameraBtn">🔄 Cambiar Cámara</button>
    </header>

    <main class="main-container">
        
        <!-- ZONA 1: CÁMARAS -->
        <section class="zone-cameras">
            <h2 class="section-title">Zona 1: Cámaras</h2>
            
            <div class="cameras-grid">
                <!-- Mi Cámara -->
                <div class="camera-box">
                    <span>Mi Dispositivo</span>
                    <div class="video-wrapper">
                        <video id="localVideo" autoplay playsinline muted></video>
                    </div>
                </div>

                <!-- Cámara Remota -->
                <div class="camera-box">
                    <span>Remoto (Peer)</span>
                    <div class="video-wrapper">
                        <video id="remoteVideo" autoplay playsinline></video>
                        <div id="noCamMessage" class="no-cam-text">Esperando...</div>
                    </div>
                </div>
            </div>

            <!-- Controles de Conexión Automática -->
            <div style="background-color: #0f172a; padding: 6px; border-radius: 6px; border: 1px solid #1e293b; display: flex; flex-direction: column; gap: 4px; margin-top: auto;">
                <button id="connectServerBtn" class="btn-success" style="width: 100%;">Conectar a la Sala P2P</button>
                <span id="connectionStatus" style="font-size: 9px; color: #94a3b8; text-align: center;">Estado: Desconectado</span>
            </div>
        </section>

        <!-- ZONA 2: CHAT DE TEXTO -->
        <section class="zone-chat">
            <h2 class="section-title">Zona 2: Chat P2P</h2>
            
            <div id="chatMessages" class="chat-messages">
                <div style="color: #64748b; text-align: center; font-size: 10px;">Los mensajes y cámaras se conectan automáticamente.</div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="Escribe un mensaje...">
                <button id="sendBtn">Enviar</button>
            </div>
        </section>

    </main>

    <!-- Script de Socket.io (Apunta a tu Render o IP local) -->
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <script>
       

        const socket = io(); 
       
        let localStream;
        let peerConnection;
        let dataChannel;
        let useFrontCamera = true;

      function initPeer() {
      peer = new Peer({
        config: {
            'iceServers': [
                // 1. Servidor STUN gratuito de Google (descubre IP pública)
                { urls: 'stun:stun.l.google.com:19302' },
                
                // 2. Servidores TURN de ExpressTURN (Evitan bloqueos de red y NAT estricto)
                {
                    urls: [
                        'turn:global.expressturn.com:3478?transport=udp',
                        'turn:global.expressturn.com:3478?transport=tcp',
                        'turn:global.expressturn.com:80',
                        'turn:global.expressturn.com:443'
                    ],
                    username: '000000002102154901',     // Proporcionado en tu panel de ExpressTURN
                    credential: 'zTwHEShFvegqotlDMnVBLEt7pTo='   // Tu contraseña o clave secreta
                }
            ]

            
        }
        
    });

    peer.on('open', (id) => {
        myIdSpan.textContent = id;
        console.log("Conectado al servidor de señalización con ID:", id);
    });

    // Control de desconexiones para evitar que la app muera
    peer.on('disconnected', () => {
        console.warn("Desconectado del servidor. Intentando reconectar...");
        setTimeout(() => {
            peer.reconnect();
        }, 3000);
    });

    peer.on('error', (err) => {
        console.error("Error en PeerJS:", err);
    });
}


        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const noCamMessage = document.getElementById('noCamMessage');
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const connectionStatus = document.getElementById('connectionStatus');

        async function initCamera() {
            try {
                if (localStream) localStream.getTracks().forEach(t => t.stop());
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: useFrontCamera ? 'user' : 'environment', width: 640, height: 480 },
                    audio: true
                });
                localVideo.srcObject = localStream;
            } catch (err) {
                console.error("Error de cámara:", err);
                alert("Permiso de cámara denegado o no disponible.");
            }
        }

        document.getElementById('switchCameraBtn').addEventListener('click', async () => {
            useFrontCamera = !useFrontCamera;
            await initCamera();
            if (peerConnection) {
                const videoTrack = localStream.getVideoTracks()[0];
                const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                if (sender) sender.replaceTrack(videoTrack);
            }
        });

        document.getElementById('connectServerBtn').addEventListener('click', () => {
            socket.emit('join-room', 'sala-universal-p2p');
            connectionStatus.innerText = "Estado: Buscando dispositivo en la sala...";
            
            // Iniciar llamada creando oferta
            startCall();
        });

        function createPeerConnection() {
            if (peerConnection) return;
            peerConnection = new RTCPeerConnection(rtcConfig);

            // Añadir pistas de vídeo y audio locales
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            // Recibir vídeo remoto
            peerConnection.ontrack = (event) => {
                noCamMessage.style.display = 'none';
                remoteVideo.srcObject = event.streams[0];
                connectionStatus.innerText = "Estado: Conectado (Cámara y Chat Activos)";
            };

            // Intercambiar candidatos ICE
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', event.candidate);
                }
            };
        }

        async function startCall() {
            createPeerConnection();
            
            // Crear canal de datos para el chat
            dataChannel = peerConnection.createDataChannel("chat");
            setupDataChannel();

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('offer', offer);
        }

        socket.on('offer', async (offer) => {
            createPeerConnection();

            peerConnection.ondatachannel = (event) => {
                dataChannel = event.channel;
                setupDataChannel();
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer', answer);
            connectionStatus.innerText = "Estado: Conectado (Cámara y Chat Activos)";
        });

        socket.on('answer', async (answer) => {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
        });

        socket.on('ice-candidate', async (candidate) => {
            if (peerConnection) {
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
                } catch (e) {
                    console.error("Error al añadir ICE candidate", e);
                }
            }
        });

        function setupDataChannel() {
            dataChannel.onopen = () => appendSystemMessage("¡Canal de Chat P2P conectado!");
            dataChannel.onmessage = (event) => {
                appendMessage("Remoto", event.data, "background-color: #1e293b; margin-right: auto;");
            };
        }

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            if (dataChannel && dataChannel.readyState === 'open') {
                dataChannel.send(text);
                appendMessage("Tú", text, "background-color: #4f46e5; margin-left: auto;");
                messageInput.value = "";
            } else {
                alert("El chat P2P aún no está conectado.");
            }
        }

        function appendMessage(sender, text, style) {
            const div = document.createElement('div');
            div.style.cssText = `padding: 4px 8px; border-radius: 4px; max-width: 80%; font-size: 11px; ${style}`;
            div.innerHTML = `<strong style="font-size: 9px; display: block; color: #cbd5e1;">${sender}</strong>${text}`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function appendSystemMessage(text) {
            const div = document.createElement('div');
            div.style.cssText = "color: #10b981; text-align: center; font-size: 10px; margin: 2px 0;";
            div.innerText = text;
            chatMessages.appendChild(div);
        }

        initCamera();


     
    </script>
</body>
</html>
